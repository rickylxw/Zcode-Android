name: Release APK

# 推送 v* 标签时自动构建签名 APK 并发布到 GitHub Release。
# 首次使用前需要配置仓库 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64      app/release.jks 的 base64 内容（PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("app\release.jks")) | Set-Clipboard）
#   KEYSTORE_PASSWORD    zcode-update-2026（或你自定义的密码）
#   KEY_ALIAS            zcode
#   KEY_PASSWORD         zcode-update-2026
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "keystore restored: $(wc -c < app/release.jks) bytes"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，后续签名步骤会失败。请按 README 配置仓库 Secrets。"
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "ZCode-v${VERSION}.apk"
          echo "APK: ZCode-v${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ZCode-v*.apk
          generate_release_notes: true
