<!doctype html>
<!--
  ZCode 桥接 mini 桌面看板（自包含单页，无任何外部依赖）
  由桥接服务在 /mini 提供；token 优先经启动器放入 URL # 片段（不会随请求上报），
  本机打开时也可从 /mini/bootstrap（仅回环放行）自动获取；API/WS 逐请求鉴权与手机端一致。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCode mini 看板</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #161a22; --card: #1b202b; --line: #262c3a;
    --fg: #d7dce6; --dim: #8a93a6; --faint: #5b6478;
    --accent: #5b9bff; --green: #34c778; --red: #ff6b6b; --amber: #f0b24a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    user-select: none;
  }
  header .logo { font-weight: 700; font-size: 14px; letter-spacing: .5px; }
  .badge {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  .dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: #3a4256; }
  .dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .spacer { flex: 1; }
  main { flex: 1; overflow-y: auto; padding: 10px 12px; }
  h2 {
    font-size: 11px; color: var(--faint); font-weight: 600; letter-spacing: 1px;
    margin: 14px 0 6px; text-transform: uppercase;
  }
  h2:first-child { margin-top: 0; }
  h3 { font-size: 11px; color: var(--faint); font-weight: 600; margin: 10px 0 4px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; margin-bottom: 8px;
  }
  .card .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .head { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .card .head > div:first-child { flex: 1; min-width: 0; }
  .chev { color: var(--faint); flex: none; margin-top: 2px; transition: transform .15s; }
  .card.open .chev { transform: rotate(90deg); }
  .card .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .since { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .elapsed { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .hrow { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
  .hrow h2 { margin: 0; }
  button.mini { font-size: 11px; padding: 2px 10px; }
  #newTask { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; }
  #newTask.show { display: block; }
  #newTask .frm-row { display: flex; gap: 8px; margin-bottom: 8px; }
  #newTask input, #newTask select, #newTask textarea {
    flex: 1; background: #12151d; border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); font: inherit; font-size: 12px; padding: 6px 9px; outline: none; min-width: 0;
  }
  #newTask input:focus, #newTask textarea:focus, #newTask select:focus { border-color: var(--accent); }
  #newTask textarea { resize: vertical; }
  .qbadge { color: var(--amber); font-size: 12px; }
  .event { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event .tool { color: var(--accent); }
  button {
    background: #232a3a; color: var(--fg); border: 1px solid #303850; border-radius: 7px;
    font: inherit; font-size: 12px; padding: 3px 12px; cursor: pointer;
  }
  button:hover { background: #2b3448; }
  button.stop { border-color: #5c2f36; color: #ff9b9b; }
  button.stop:hover { background: #3a2429; }
  .spin {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    border: 2px solid #31405e; border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 展开的详情区 */
  .detail { display: none; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .card.open .detail { display: block; }
  .detail .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .prompt, pre.stream, ul.feed {
    background: #12151d; border: 1px solid var(--line); border-radius: 8px;
  }
  .prompt {
    margin: 8px 0 0; padding: 7px 9px; color: var(--dim); font-size: 12px;
    white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow-y: auto;
  }
  pre.stream {
    margin: 8px 0 0; padding: 7px 9px; max-height: 130px; overflow-y: auto;
    font: 12px/1.5 Consolas, "Courier New", monospace; color: #a8b3c7;
    white-space: pre-wrap; word-break: break-word;
  }
  .card.open pre.stream { max-height: 320px; }
  pre.stream .think { color: var(--faint); }
  .feed { margin: 8px 0 0; padding: 4px 8px; list-style: none; max-height: 200px; overflow-y: auto; }
  .feed li {
    display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #2026344d;
    font-size: 12px; color: var(--dim); min-width: 0;
  }
  .feed li:last-child { border-bottom: none; }
  .feed time { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
  .feed .src { flex: none; }
  .feed .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main > ul.feed { background: none; border: none; padding: 0; max-height: none; }
  main > ul.feed li:last-child { border-bottom: 1px dashed #2026344d; }
  .empty { color: var(--faint); text-align: center; padding: 18px 0 6px; user-select: none; }
  footer { padding: 6px 12px 8px; color: var(--faint); font-size: 11px; border-top: 1px solid var(--line); user-select: none; display: flex; align-items: center; gap: 10px; }
  footer #foot { flex: 1; }
  /* token 输入浮层 */
  #gate {
    position: fixed; inset: 0; background: #0f1115ee; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 9;
  }
  #gate.show { display: flex; }
  #gate input {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); font: inherit; padding: 7px 10px; width: 240px; outline: none;
  }
  #gate input:focus { border-color: var(--accent); }
  #gate .hint { color: var(--dim); font-size: 12px; max-width: 300px; text-align: center; }
  #gate code { color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="logo">ZCode mini</span>
  <span class="badge" id="engine">—</span>
  <span class="badge" id="uptime">运行 —</span>
  <span class="badge" id="usage">今日 —</span>
  <span class="spacer"></span>
  <span class="badge" id="conn" title="看板与桥接的连接"><span class="dot off"></span>连接中…</span>
  <span class="badge" id="phone" title="手机 App 的 WebSocket 在线状态"><span class="dot off"></span>手机离线</span>
</header>

<main>
  <div class="hrow"><h2>运行中的任务</h2><button class="mini" id="newTaskBtn">＋ 新任务</button></div>
  <div id="newTask">
    <div class="frm-row"><input id="ntDir" list="ntProjects" placeholder="项目目录（如 E:\work\demo）" autocomplete="off"><datalist id="ntProjects"></datalist></div>
    <div class="frm-row">
      <select id="ntMode">
        <option value="yolo">全自动（yolo）</option>
        <option value="build">构建（build）</option>
        <option value="edit">编辑（edit）</option>
        <option value="plan">规划（plan）</option>
      </select>
    </div>
    <div class="frm-row"><textarea id="ntPrompt" rows="2" placeholder="任务目标…"></textarea></div>
    <div class="frm-row"><button id="ntSend" class="mini">发送任务</button></div>
  </div>
  <div id="running"><div class="empty">加载中…</div></div>

  <h2>最近动态</h2>
  <ul class="feed" id="feed"></ul>
  <div class="empty" id="feedEmpty" hidden>暂无动态</div>
</main>

<footer>
  <button class="mini" id="notifyBtn" title="任务完成时弹系统通知">🔔 提醒：关</button>
  <span id="foot">等待桥接状态…</span>
</footer>

<div id="gate">
  <div class="hint">未取得桥接 token。本机打开通常会自动获取；也可手动输入 bridge.config.json 里的 token，或用 <code>npm run mini</code> 启动：</div>
  <input id="tokenInput" placeholder="配对 token" autocomplete="off">
  <button id="tokenGo">连接</button>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const store_ = {
  status: null,            // 最近一次 status 快照
  events: new Map(),       // 会话/任务 key -> 最新 progress 事件
  streams: new Map(),      // 会话/任务 key -> { text, reasoning }
  feed: [],                // 最近动态（新的在前）
  open: new Set(),         // 展开详情的卡片 key
  token: null,
  ws: null, wsTimer: null, wsDelay: 1000,
};

// ---------- token：#片段 → localStorage → 本机引导接口 → 手动输入 ----------
function initialToken() {
  if (location.hash.length > 1) {
    const t = decodeURIComponent(location.hash.slice(1)).trim();
    if (t) {
      localStorage.setItem('miniToken', t);
      history.replaceState(null, '', location.pathname); // 用完即从地址栏抹掉
      return t;
    }
  }
  return localStorage.getItem('miniToken');
}
async function resolveToken() {
  const t = initialToken();
  if (t) return t;
  try { // 本机打开（127.0.0.1/localhost）时桥接允许自动取 token；局域网设备会被 403
    const r = await fetch('/mini/bootstrap');
    if (r.ok) {
      const j = await r.json();
      if (j.token) {
        localStorage.setItem('miniToken', j.token);
        return j.token;
      }
    }
  } catch {}
  return null;
}
function askToken() {
  $('#gate').classList.add('show');
}
$('#tokenGo').addEventListener('click', () => {
  const t = $('#tokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('miniToken', t);
  $('#gate').classList.remove('show');
  store_.token = t;
  connect();
});
$('#tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#tokenGo').click(); });

// ---------- 工具 ----------
const pad = (n) => String(n).padStart(2, '0');
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分 ' + pad(s % 60) + ' 秒';
  return Math.floor(m / 60) + ' 时 ' + pad(m % 60) + ' 分';
}
function fmtClock(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function fmtStartClock(ts) { // 今天的任务只显示时刻，更早的带日期
  const d = new Date(ts), now = new Date();
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return hm;
  const yest = new Date(now);
  yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return '昨日 ' + hm;
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}
function fmtTokens(n) {
  if (n == null) return '—';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function baseName(p) { return p ? String(p).replace(/[\\/]+$/, '').split(/[\\/]/).pop() : ''; }
const MODE_NAME = { plan: '规划', build: '构建', edit: '编辑', yolo: '全自动' };
function eventText(ev) {
  switch (ev?.kind) {
    case 'turn_started':    return '开始回合';
    case 'model_request':   return '请求模型…';
    case 'tool_started':    return '调用工具 ' + (ev.toolName || '');
    case 'tool_completed':  return '完成 ' + (ev.toolName || '') + (ev.durationMs != null ? '（' + fmtDur(ev.durationMs) + '）' : '');
    case 'turn_completed':  return '回合完成' + (ev.durationMs != null ? '，用时 ' + fmtDur(ev.durationMs) : '');
    default: return ev?.kind || '';
  }
}

async function api(path, opts) {
  const res = await fetch('/api/' + path, { ...opts, headers: { Authorization: 'Bearer ' + store_.token, ...(opts?.headers || {}) } });
  if (res.status === 401) { askToken(); throw new Error('未授权'); }
  return res.json();
}

async function fetchUsage() { // 今日用量徽标
  try {
    const j = await api('usage');
    const t = j.summary?.today;
    if (t) $('#usage').textContent = '今日 ' + t.turns + ' 回合 · ' + fmtTokens(t.totalTokens) + ' tokens';
  } catch {}
}

function feedPush(label) {
  store_.feed.unshift({ at: Date.now(), label, count: 1 });
  store_.feed.length = Math.min(store_.feed.length, 40);
}

// ---------- 渲染 ----------
function render() {
  const st = store_.status;
  if (!st) return;

  $('#engine').textContent = st.bridge.engine === 'appserver' ? 'app-server' : 'headless';
  $('#uptime').textContent = '运行 ' + fmtDur(Date.now() - st.bridge.startedAt) + ' · v' + st.bridge.version;

  const n = st.phone.connected;
  $('#phone').innerHTML = n > 0
    ? '<span class="dot on"></span>手机在线' + (n > 1 ? ' ×' + n : '')
    : '<span class="dot off"></span>手机离线' + (st.phone.lastSeenAt ? ' · 最近 ' + fmtClock(st.phone.lastSeenAt).slice(0, 5) : '');

  // 运行中任务卡片（点击标题区展开详情）
  const run = $('#running');
  if (!st.running.length) {
    run.innerHTML = '<div class="empty">当前没有运行中的任务</div>';
  } else {
    run.innerHTML = st.running.map((r) => {
      const key = r.sessionId ?? r.jobId;
      const open = store_.open.has(key);
      const ev = store_.events.get(key);
      const name = esc(r.title || '（新会话）');
      const dir = esc(baseName(r.directory));
      const qn = st.queued[r.sessionId] ?? (r.queueItems?.length ?? 0);
      const q = qn > 0 ? '<span class="qbadge">队列 ' + qn + ' 条</span>' : '';
      const evHtml = ev ? '· <span class="event">' + esc(eventText(ev)).replace(/(调用工具 [\w:.-]+)/, '<span class="tool">$1</span>') + '</span>' : '';

      // 详情区：模式/模型/ID 徽标、任务原文、待发送队列、事件时间线
      const badges = [MODE_NAME[r.mode], r.model, r.jobId ? 'job ' + r.jobId.slice(5, 15) : null, r.sessionId ? r.sessionId.slice(0, 18) : null]
        .filter(Boolean).map((b) => '<span class="badge">' + esc(b) + '</span>').join('');
      const promptHtml = r.prompt ? '<div class="prompt">' + esc(r.prompt) + '</div>' : '';
      const qItems = (r.queueItems ?? []).map((qi) =>
        '<li><span class="src">' + (qi.source === 'phone' ? '📱' : '🖥') + '</span><span class="what">' + esc(qi.text) + '</span></li>'
      ).join('');
      const qHtml = qItems ? '<h3>待发送队列（' + r.queueItems.length + '）</h3><ul class="feed">' + qItems + '</ul>' : '';
      const timeline = (r.events ?? []).map((e) => {
        const ts = e.timestamp ? fmtClock(Date.parse(e.timestamp)) : '';
        return '<li><time>' + ts + '</time><span class="what">' + esc(eventText(e)) + '</span></li>';
      }).join('');
      const tlHtml = timeline ? '<h3>事件时间线（正序）</h3><ul class="feed">' + timeline + '</ul>' : '';

      const stream = store_.streams.get(key);
      let streamHtml = '';
      if (stream && (stream.text || stream.reasoning)) {
        const cap = open ? 4000 : 800;
        streamHtml = '<pre class="stream">' + (stream.text
          ? esc(stream.text.slice(-cap))
          : '<span class="think">' + esc((stream.reasoning || '').slice(-cap)) + '</span>') + '</pre>';
      }

      return '<div class="card' + (open ? ' open' : '') + '" data-key="' + esc(key) + '">' +
        '<div class="head"><div><div class="title">' + name + '</div>' +
        (dir ? '<div class="sub">📁 ' + dir + '</div>' : '') + '</div><span class="chev">▶</span></div>' +
        '<div class="row"><span class="spin"></span>' +
        '<span class="since">' + fmtStartClock(r.since) + ' 起 ·</span>' +
        '<span class="elapsed" data-since="' + r.since + '">' + fmtDur(Date.now() - r.since) + '</span>' + evHtml + q +
        (r.sessionId
          ? '<button class="stop" data-stop-session="' + esc(r.sessionId) + '">停止</button>'
          : '<button class="stop" data-stop-job="' + esc(r.jobId) + '">停止</button>') +
        '</div>' +
        '<div class="detail">' + (badges ? '<div class="badges">' + badges + '</div>' : '') + promptHtml + streamHtml + qHtml + tlHtml + '</div>' +
        (open ? '' : streamHtml) + '</div>';
    }).join('');
  }

  // 最近动态
  $('#feedEmpty').hidden = store_.feed.length > 0;
  $('#feed').innerHTML = store_.feed.slice(0, 12).map((f) =>
    '<li><time>' + fmtClock(f.at) + '</time><span class="what">' + esc(f.label) + (f.count > 1 ? ' <b>×' + f.count + '</b>' : '') + '</span></li>'
  ).join('');

  const totalQueued = Object.values(st.queued).reduce((a, b) => a + b, 0);
  $('#foot').textContent = '看板已连接 · 任务 ' + st.running.length + ' 个' + (totalQueued ? ' · 待发送 ' + totalQueued + ' 条' : '') + ' · 手机 ' + (n > 0 ? '在线' : '离线');
}

// 每秒只刷新计时文本，避免整页重渲染打断滚动/选择
setInterval(() => {
  for (const el of document.querySelectorAll('.elapsed')) el.textContent = fmtDur(Date.now() - Number(el.dataset.since));
  if (store_.status) $('#uptime').textContent = '运行 ' + fmtDur(Date.now() - store_.status.bridge.startedAt) + ' · v' + store_.status.bridge.version;
}, 1000);

// ---------- WebSocket ----------
function setConn(state) {
  const cls = state === 'on' ? 'on' : state === 'err' ? 'err' : 'off';
  const txt = state === 'on' ? '已连接' : state === 'err' ? '重连中…' : '连接中…';
  $('#conn').innerHTML = '<span class="dot ' + cls + '"></span>' + txt;
}

function connect() {
  clearTimeout(store_.wsTimer);
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(store_.token) + '&client=mini');
  store_.ws = ws;

  ws.onopen = () => {
    store_.wsDelay = 1000;
    setConn('on');
    ws.send(JSON.stringify({ type: 'watch' }));
    fetchUsage();
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'status') {
      store_.status = m;
      render();
    } else if (m.type === 'progress') {
      const key = m.jobId && !m.sessionId ? m.jobId : (m.sessionId ?? m.jobId);
      store_.events.set(key, m.event);
      const title = store_.status?.running.find((r) => (r.sessionId ?? r.jobId) === key)?.title || '任务';
      if (m.event.kind === 'turn_completed') notifyTurnDone(title, m.event.durationMs);
      const label = title + ' · ' + eventText(m.event);
      const prev = store_.feed[0];
      // 同一会话同类事件 15s 内重复（连续同名工具/双通道）→ 合并为一行并计数
      if (prev && prev.key === key && prev.label === label && Date.now() - prev.at < 15000) {
        prev.count = (prev.count || 1) + 1;
        prev.at = Date.now();
      } else {
        store_.feed.unshift({ at: Date.now(), key, label, count: 1 });
      }
      store_.feed.length = Math.min(store_.feed.length, 40);
      render();
    } else if (m.type === 'prompt_accepted') {
      if (pendingPrompts.has(m.requestId)) {
        const dir = pendingPrompts.get(m.requestId);
        pendingPrompts.delete(m.requestId);
        feedPush('任务已受理（' + baseName(dir) + '）');
        render();
      }
    } else if (m.type === 'error' && pendingPrompts.has(m.requestId)) {
      pendingPrompts.delete(m.requestId);
      feedPush('任务被拒绝：' + (m.message ?? '未知错误'));
      render();
    } else if (m.type === 'stream') {
      const key = m.jobId && !m.sessionId ? m.jobId : m.sessionId;
      const prev = store_.streams.get(key) || {};
      store_.streams.set(key, { text: m.text ?? prev.text ?? '', reasoning: m.reasoning ?? prev.reasoning ?? '' });
      render();
      // 流式文本滚动到底
      for (const pre of document.querySelectorAll('.card pre.stream')) pre.scrollTop = pre.scrollHeight;
    }
  };
  ws.onclose = (e) => {
    setConn('err');
    if (e.code === 4001) { askToken(); return; } // token 错误：不自动重试
    store_.wsTimer = setTimeout(connect, store_.wsDelay);
    store_.wsDelay = Math.min(store_.wsDelay * 2, 10000);
  };
  ws.onerror = () => ws.close();
}

// 卡片展开/收起：用 pointerdown 而不是 click——整页重渲染可能发生在按下与抬起之间，
// 把 click 连同旧节点一起吞掉；pointerdown 在按下瞬间就处理，不受重渲染影响
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  const card = e.target.closest('.card[data-key]');
  if (!card) return;
  const key = card.dataset.key;
  if (store_.open.has(key)) store_.open.delete(key);
  else store_.open.add(key);
  render();
});

// 停止按钮（已绑定会话走 REST；新会话尚未绑定 sessionId 时走 WS stop_job）
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.stopSession) {
    b.disabled = true;
    try {
      const r = await api('sessions/' + b.dataset.stopSession + '/stop', { method: 'POST' });
      store_.feed.unshift({ at: Date.now(), label: r.ok ? '已发送停止指令' : '停止失败：' + (r.error || '未知错误') });
      render();
    } catch {} finally { b.disabled = false; }
  } else if (b.dataset.stopJob) {
    store_.ws?.send(JSON.stringify({ type: 'stop_job', jobId: b.dataset.stopJob }));
    store_.feed.unshift({ at: Date.now(), label: '已发送停止指令' });
    render();
  }
});

// ---------- 任务完成系统通知 ----------
const notifyOn = () => localStorage.getItem('miniNotify') === '1';
function setNotifyBtn() { $('#notifyBtn').textContent = '🔔 提醒：' + (notifyOn() ? '开' : '关'); }
$('#notifyBtn').addEventListener('click', async () => {
  if (notifyOn()) {
    localStorage.setItem('miniNotify', '0');
  } else {
    if (!('Notification' in window)) { store_.feed.unshift({ at: Date.now(), label: '此环境不支持浏览器通知', count: 1 }); render(); return; }
    let perm = Notification.permission;
    if (perm === 'default') perm = await Notification.requestPermission();
    if (perm !== 'granted') { store_.feed.unshift({ at: Date.now(), label: '浏览器通知权限被拒绝，无法开启提醒', count: 1 }); render(); return; }
    localStorage.setItem('miniNotify', '1');
    feedPush('完成提醒已开启');
  }
  setNotifyBtn();
  render();
});
function notifyTurnDone(title, durMs) {
  if (!notifyOn() || !('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification('✅ 任务完成：' + title, { body: '用时 ' + fmtDur(durMs || 0) + ' · ' + fmtClock(Date.now()), tag: 'zcode-mini-done', silent: false });
    n.onclick = () => { window.focus(); n.close(); };
  } catch {}
}

// ---------- 看板直接下发新任务 ----------
const pendingPrompts = new Map(); // requestId -> directory（自己发出的 prompt，用于配对回执）
$('#newTaskBtn').addEventListener('click', () => {
  const f = $('#newTask');
  f.classList.toggle('show');
  if (f.classList.contains('show') && !$('#ntProjects').options.length) {
    api('projects').then((j) => {
      for (const p of j.projects ?? []) {
        const o = document.createElement('option');
        o.value = p.directory;
        $('#ntProjects').appendChild(o);
      }
    }).catch(() => {});
  }
});
$('#ntSend').addEventListener('click', () => {
  const directory = $('#ntDir').value.trim();
  const prompt = $('#ntPrompt').value.trim();
  const mode = $('#ntMode').value;
  if (!directory || !prompt) { feedPush('目录和任务描述都不能为空'); render(); return; }
  const requestId = 'mini_' + Date.now();
  pendingPrompts.set(requestId, directory);
  store_.ws?.send(JSON.stringify({ type: 'prompt', requestId, sessionId: null, directory, prompt, mode }));
  feedPush('已发送新任务 → ' + baseName(directory));
  $('#ntPrompt').value = '';
  render();
});

// ---------- 启动 ----------
(async () => {
  store_.token = await resolveToken();
  setNotifyBtn();
  if (!store_.token) askToken(); else connect();
  setInterval(fetchUsage, 5 * 60 * 1000);
})();
</script>
</body>
</html>
